[project]
name = "health-coach"
version = "0.1.0"
description = "Self-hosted health data warehouse and MCP servers for an AI fitness coach"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "pyjwt[crypto]>=2.15",
    "sqlalchemy>=2.1",
    "sqlglot>=30.22",
    "tenacity>=9.2",
    "typer>=0.27",
]

[project.scripts]
health-coach = "health_coach.cli:app"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_coach"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MCPServer.custom_route is not annotated in the SDK.
module = ["health_coach.mcp_server.*", "health_coach.fit.*"]
disallow_untyped_decorators = false

