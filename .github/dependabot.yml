# Version updates for every ecosystem in the repo. Grouped and monthly to keep the
# PR count low; security updates arrive separately as soon as an advisory is published
# (enable "Dependabot security updates" in the repository settings). The cooldown
# skips releases younger than a week, which keeps freshly hijacked packages out.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Odd Node.js majors never become LTS; stay on the even (LTS) line.
      - dependency-name: "node"
        versions: ["25.x", "27.x"]
